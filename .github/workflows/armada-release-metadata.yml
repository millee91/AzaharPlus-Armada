name: Publish experimental Armada ARM64 prerelease

on:
  push:
    branches:
      - AzaharPlus
    paths:
      - .github/workflows/armada-release-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-existing-prerelease:
    name: Publish verified release assets for public testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out notes
        uses: actions/checkout@v4

      - name: Publish existing draft as prerelease without replacing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id=447469594
          tag='armada-AZAHAR_PLUS_2126_2_A'
          title='AzaharPlus 2126.2.A - Armada OS (ARM64)'
          image='AzaharPlus-2126.2.A-Armada-aarch64.AppImage'
          digest='sha256:b13593e8f32a8618343f3c55c620898f7d4a25fd5d8f8e2168dd1f2ec21618d0'

          before="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          jq -e --arg tag "$tag" --arg image "$image" --arg digest "$digest" \
            '.draft == true and .prerelease == true and .tag_name == $tag and (.assets | length) == 5 and any(.assets[]; .name == $image and .digest == $digest)' <<< "$before"

          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=true \
            -f name="$title" \
            -f body="$(cat RELEASE_NOTES.md)" \
            --jq '{id, tag_name, name, draft, prerelease, assets: (.assets | length)}'

          after="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          jq -e --arg tag "$tag" --arg image "$image" --arg digest "$digest" \
            '.draft == false and .prerelease == true and .tag_name == $tag and (.assets | length) == 5 and any(.assets[]; .name == $image and .digest == $digest)' <<< "$after"
          echo "Published experimental prerelease with unchanged assets."
