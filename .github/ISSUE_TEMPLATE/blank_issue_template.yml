name: Armada OS - Test results or feedback
description: Share a successful launch, a compatibility result, or other constructive feedback
title: "[Armada OS] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing the unofficial AzaharPlus ARM64 AppImage. Please include the device model and Armada OS build. Do not attach copyrighted games, keys, or system files.
  - type: textarea
    id: feedback
    attributes:
      label: Test result / feedback
      description: Which device, OS version, and AppImage version did you use? What worked and what did not?
    validations:
      required: true
